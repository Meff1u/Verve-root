syntax = "proto3";

import "rootsdk/types.proto";

// Spotify has no audio of its own: its tracks are matched to YouTube Music when they're about to play
enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_YOUTUBE = 1;
    SOURCE_SOUNDCLOUD = 2;
    SOURCE_SPOTIFY = 3;
}

// url is the track's page on its platform; the audio itself always comes through the server (GetAudio)
message Track {
    string id = 1;
    string url = 2;
    string title = 3;
    string added_by = 4;
    string artist = 5;
    string album = 6;
    int32 year = 7;
    string cover_url = 8;
    double duration = 9;
    Source source = 10;
    string source_id = 11;
}

enum RepeatMode {
    REPEAT_MODE_OFF = 0;
    REPEAT_MODE_ALL = 1;
    REPEAT_MODE_ONE = 2;
}

// The whole shared player in one message: position is in seconds as of updated_at (server clock, ms since epoch),
// so every client can extrapolate where playback is right now without the server ticking
message PlayerState {
    repeated Track queue = 1;
    int32 current = 2;
    bool playing = 3;
    double position = 4;
    double updated_at = 5;
    RepeatMode repeat = 6;
    int32 listeners = 7;
}

enum PlayerError {
    PLAYER_ERROR_UNSPECIFIED = 0;
    PLAYER_ERROR_UNSUPPORTED_LINK = 1;
    PLAYER_ERROR_TRACK_NOT_FOUND = 2;
    PLAYER_ERROR_QUEUE_FULL = 3;
    PLAYER_ERROR_SOURCE_FAILED = 4;
}

message GetStateRequest {}

message GetStateResponse {
    PlayerState state = 1;
    double server_time = 2;
}

message SearchRequest {
    string query = 1;
    Source source = 2;
}

message SearchResponse {
    repeated Track results = 1;
}

// A YouTube, SoundCloud or Spotify link to a track, album or playlist
message ImportLinkRequest {
    string url = 1;
}

message AddTracksRequest {
    repeated Track tracks = 1;
}

// Audio travels in chunks small enough for Root's message limit; total tells the client how many to ask for
message GetAudioRequest {
    string track_id = 1;
    int32 chunk = 2;
}

message GetAudioResponse {
    bytes data = 1;
    int32 total = 2;
    string mime_type = 3;
}

message RemoveRequest {
    string track_id = 1;
}

message MoveRequest {
    string track_id = 1;
    int32 to_index = 2;
}

// An empty track_id resumes the current track
message PlayRequest {
    string track_id = 1;
}

message PauseRequest {}

message SeekRequest {
    double position = 1;
}

message NextRequest {}

message PreviousRequest {}

message ShuffleRequest {}

message SetRepeatRequest {
    RepeatMode repeat = 1;
}

message TrackEndedRequest {
    string track_id = 1;
}

message StateResponse {
    PlayerState state = 1;
}

message StateChangedEvent {
    PlayerState state = 1;
}

service PlayerService {
    rpc GetState(GetStateRequest) returns (GetStateResponse);
    rpc Search(SearchRequest) returns (SearchResponse);
    rpc ImportLink(ImportLinkRequest) returns (StateResponse);
    rpc AddTracks(AddTracksRequest) returns (StateResponse);
    rpc GetAudio(GetAudioRequest) returns (GetAudioResponse);
    rpc Remove(RemoveRequest) returns (StateResponse);
    rpc Move(MoveRequest) returns (StateResponse);
    rpc Play(PlayRequest) returns (StateResponse);
    rpc Pause(PauseRequest) returns (StateResponse);
    rpc Seek(SeekRequest) returns (StateResponse);
    rpc Next(NextRequest) returns (StateResponse);
    rpc Previous(PreviousRequest) returns (StateResponse);
    rpc Shuffle(ShuffleRequest) returns (StateResponse);
    rpc SetRepeat(SetRepeatRequest) returns (StateResponse);
    rpc TrackEnded(TrackEndedRequest) returns (StateResponse);

    rpc BroadcastStateChanged(StateChangedEvent) returns (rootsdk.Void);
}
